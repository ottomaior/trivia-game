name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trivia
          POSTGRES_PASSWORD: trivia
          POSTGRES_DB: trivia
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U trivia"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://trivia:trivia@localhost:5432/trivia
      TEST_DATABASE_URL: postgres://trivia:trivia@localhost:5432/trivia
      E2E_DATABASE_URL: postgres://trivia:trivia@localhost:5432/trivia
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm db:migrate
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
